; FRAGMENTO orientativo, NO sustituye el INI completo distribuido con RS ASIO.
; Partir del archivo de RS ASIO 0.7.5 y completar el driver real del puente.
; Consultar RS_ASIO-log.txt: no suponer que el driver se llama igual en todos los prefijos.
[Asio.Input.0]
Driver=REEMPLAZAR_CON_DRIVER_ASIO_DEL_REGISTRO
Channel=1
EnableSoftwareEndpointVolumeControl=1
EnableSoftwareMasterVolumeControl=1
SoftwareMasterVolumePercent=100
; Channel=1 solo si INST 2 conserva el índice de canal en el puente.
